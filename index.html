<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bafi | Linky a Profil</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       1. GLOBAL RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================
       2. CANVAS BACKGROUND
       ========================================== */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================
       3. MAIN WRAPPER (LAYOUT)
       ========================================== */
    .wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: row;
      gap: 28px;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==========================================
       4. CONTAINER CARD (LEFT SIDE)
       ========================================== */
    .container {
      flex: 1;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      background: rgba(12, 12, 12, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(255, 255, 255, 0.03);
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .container:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================
       5. HEADER & TITLE STYLES
       ========================================== */
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
    }

    /* ==========================================
       6. AUDIO CONTROL BUTTON
       ========================================== */
    .music-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      user-select: none;
    }

    .music-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .music-btn:active {
      transform: scale(0.98);
    }

    .music-btn i {
      font-size: 0.95rem;
    }

    /* ==========================================
       7. LINKS CONTAINER & BUTTONS
       ========================================== */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      transition: left 0.6s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn i {
      font-size: 1.5rem;
      width: 32px;
      text-align: center;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .btn:not(.btn-split) i {
      margin-right: 14px;
    }

    .badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      color: #d1d1d1;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      font-weight: 600;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ==========================================
       8. SPLIT BUTTONS ROW (2 COLUMNS)
       ========================================== */
    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn-split {
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 16px 12px;
      gap: 6px;
    }

    .btn-split i {
      margin-right: 0;
      margin-bottom: 2px;
    }

    .btn-split span.title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .btn-split span.sub {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    /* ==========================================
       9. HOVER EFFECTS PER SOCIAL NETWORK
       ========================================== */

    /* Instagram Hover */
    .instagram:hover {
      border-color: rgba(225, 48, 108, 0.8);
      box-shadow: 0 0 22px rgba(225, 48, 108, 0.4);
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(135deg, rgba(225, 48, 108, 0.15), rgba(253, 29, 29, 0.1));
    }

    .instagram:hover i {
      color: #e1306c;
      transform: scale(1.2) rotate(-5deg);
    }

    .instagram:hover .badge {
      background: rgba(225, 48, 108, 0.3);
      color: #ffffff;
    }

    /* TikTok Hover */
    .tiktok:hover {
      border-color: rgba(254, 44, 85, 0.8);
      box-shadow: 0 0 22px rgba(254, 44, 85, 0.4), -3px 0 10px rgba(37, 244, 238, 0.3);
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(135deg, rgba(254, 44, 85, 0.15), rgba(37, 244, 238, 0.1));
    }

    .tiktok:hover i {
      color: #fe2c55;
      transform: scale(1.2) rotate(5deg);
      text-shadow: -2px 0 #25f4ee, 2px 0 #fe2c55;
    }

    .tiktok:hover .badge {
      background: rgba(254, 44, 85, 0.3);
      color: #ffffff;
    }

    /* ==========================================
       10. DISCORD WIDGET CONTAINER (RIGHT SIDE)
       ========================================== */
    .widget-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(12, 12, 12, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 12px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(255, 255, 255, 0.03);
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .widget-container:hover {
      border-color: rgba(88, 101, 242, 0.4);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(88, 101, 242, 0.2);
    }

    .widget-container iframe {
      border-radius: 20px;
      display: block;
    }

    /* ==========================================
       11. FOOTER STYLES
       ========================================== */
    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
    }

    footer span {
      transition: color 0.3s ease;
    }

    footer span:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    /* ==========================================
       12. RESPONSIVE DESIGN (MOBILE & TABLET)
       ========================================== */
    @media (max-width: 850px) {
      body {
        padding: 30px 15px;
        align-items: flex-start;
      }

      .wrapper {
        flex-direction: column;
        gap: 20px;
      }

      .container {
        max-width: 100%;
        padding: 32px 20px;
      }

      .widget-container {
        width: 100%;
      }

      .widget-container iframe {
        width: 100% !important;
        max-width: 350px;
      }
    }

    @media (max-width: 400px) {
      .split-row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Audio Background Player -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://ti.fo/f/Ls69fXJKkT1-k-CykTc5Z" type="audio/mpeg">
  </audio>

  <!-- Main Content Wrapper -->
  <div class="wrapper">

    <!-- Left Box: Links Container -->
    <div class="container">
      <h1>Bafi</h1>

      <!-- Music Toggle Button -->
      <button class="music-btn" onclick="toggleMusic()" aria-label="Pustit nebo pozastavit hudbu">
        <i id="music-icon" class="fa-solid fa-play"></i>
        <span id="music-text">Pustit hudbu</span>
      </button>

      <!-- Social Links List -->
      <div class="links-container">
        
        <!-- Main Instagram Link -->
        <a href="https://instagram.com/te.rk._a" target="_blank" rel="noopener noreferrer" class="btn instagram">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
          <span class="badge">@te.rk._a</span>
        </a>

        <!-- Main TikTok Link -->
        <a href="https://www.tiktok.com/@terkaaxd" target="_blank" rel="noopener noreferrer" class="btn tiktok">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
          <span class="badge">@terkaaxd</span>
        </a>

        <!-- Split Grid Row for Extra Accounts -->
        <div class="split-row">
          
          <!-- Secret Instagram -->
          <a href="https://www.instagram.com/n1ggram/" target="_blank" rel="noopener noreferrer" class="btn btn-split instagram">
            <i class="fa-brands fa-instagram"></i>
            <span class="title">Můj Secret</span>
            <span class="sub">@n1ggram</span>
          </a>

          <!-- Duo Instagram -->
          <a href="https://www.instagram.com/bafi_a_dave_irl/" target="_blank" rel="noopener noreferrer" class="btn btn-split instagram">
            <i class="fa-brands fa-instagram"></i>
            <span class="title">Účet Dua</span>
            <span class="sub">@bafi_a_dave_irl</span>
          </a>

        </div>

      </div>

      <!-- Footer Section -->
      <footer>
        <span>© 2026 • Bafi</span>
      </footer>
    </div>

    <!-- Right Box: Discord Live Widget -->
    <div class="widget-container">
      <iframe 
        src="https://discord.com/widget?id=1475565636720660491&theme=dark" 
        width="350" 
        height="500" 
        allowtransparency="true" 
        frameborder="0" 
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
        title="Discord Widget">
      </iframe>
    </div>

  </div>

  <!-- ==========================================
     13. JAVASCRIPT CONTROLLERS
     ========================================== -->
  <script>
    /* ------------------------------------------
       AUDIO PLAYER CONTROLLER
       ------------------------------------------ */
    const music = document.getElementById('bg-music');
    const musicIcon = document.getElementById('music-icon');
    const musicText = document.getElementById('music-text');

    // Hlasitost hudby nastavená na 20 %
    music.volume = 0.2;

    function startMusic() {
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          musicIcon.className = "fa-solid fa-pause";
          musicText.innerText = "Pozastavit hudbu";
        }).catch(() => {
          musicIcon.className = "fa-solid fa-play";
          musicText.innerText = "Pustit hudbu";
        });
      }
    }

    // Automatický start po načtení stránky
    window.addEventListener('load', () => {
      startMusic();
    });

    // Spuštění při jakémkoliv prvním kliknutí (překonání autoplay restrikcí prohlížečů)
    const enableAudioOnInteraction = () => {
      if (music.paused) {
        startMusic();
      }
      document.removeEventListener('click', enableAudioOnInteraction);
      document.removeEventListener('touchstart', enableAudioOnInteraction);
    };

    document.addEventListener('click', enableAudioOnInteraction);
    document.addEventListener('touchstart', enableAudioOnInteraction);

    function toggleMusic() {
      if (music.paused) {
        music.play();
        musicIcon.className = "fa-solid fa-pause";
        musicText.innerText = "Pozastavit hudbu";
      } else {
        music.pause();
        musicIcon.className = "fa-solid fa-play";
        musicText.innerText = "Pustit hudbu";
      }
    }

    /* ------------------------------------------
       PARTICLE CANVAS ANIMATION
       ------------------------------------------ */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 75;
    const maxDistance = 115;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fill();
      }
    }

    // Inicializace částic
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // Animační smyčka
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let a = 0; a < particles.length; a++) {
        particles[a].update();
        particles[a].draw();

        for (let b = a + 1; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDistance) {
            let opacity = 1 - (dist / maxDistance);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.15})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
