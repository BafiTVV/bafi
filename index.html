<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linky</title>
  <!-- FontAwesome pro ikonky -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0c20;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas pro animované pozadí */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Hlavní karta webu */
    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 420px;
      padding: 35px 22px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      margin: 20px 0;
    }

    /* Status tečka */
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: #747f8d;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }

    .status-online { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
    .status-idle { background-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; }
    .status-dnd { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-text {
      font-size: 0.85rem;
      color: #a3a6aa;
      margin-bottom: 18px;
    }

    /* Lanyard Rich Presence Box */
    .activity-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #b9bbbe;
      display: none;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .activity-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .activity-header i {
      font-size: 1.2rem;
      color: #7289da;
    }

    .activity-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    .activity-title {
      font-weight: 600;
      color: #fff;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-subtitle {
      font-size: 0.78rem;
      color: #a3a6aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar pro Spotify */
    .progress-container {
      width: 100%;
      margin-top: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #1ed760;
      border-radius: 2px;
      transition: width 0.5s linear;
    }

    .progress-time {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #72767d;
      margin-top: 3px;
    }

    /* Seznam tlačítek */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.98rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn i {
      font-size: 1.3rem;
      width: 28px;
      margin-right: 12px;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Individuální styly tlačítek */
    .instagram:hover { border-color: #e1306c; color: #e1306c; }
    .spotify:hover { border-color: #1ed760; color: #1ed760; }
    .steam:hover { border-color: #66c0f4; color: #66c0f4; }
    .discord-btn:hover { border-color: #5865f2; color: #5865f2; }
    
    .metin2 {
      background: linear-gradient(135deg, rgba(114, 137, 218, 0.2), rgba(155, 89, 182, 0.2));
      border: 1px solid rgba(114, 137, 218, 0.4);
    }
    .metin2:hover {
      border-color: #7289da;
      box-shadow: 0 0 15px rgba(114, 137, 218, 0.4);
    }

    .badge {
      margin-left: auto;
      font-size: 0.7rem;
      background: #7289da;
      color: #fff;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- Animované pozadí -->
  <canvas id="bg-canvas"></canvas>

  <!-- Obsah rozcestníku -->
  <div class="container">
    
    <h1>
      <span id="status-dot" class="status-dot"></span>
      Bafi
    </h1>
    <div id="status-text" class="status-text">Offline</div>

    <!-- Živá aktivita z Discordu -->
    <div id="activity-box" class="activity-box">
      <div class="activity-header">
        <i id="activity-icon" class="fa-solid fa-gamepad"></i>
        <div class="activity-details">
          <span id="activity-title" class="activity-title">Aktivita</span>
          <span id="activity-subtitle" class="activity-subtitle">...</span>
        </div>
      </div>
      <!-- Spotify Progress Bar -->
      <div id="spotify-progress" class="progress-container" style="display: none;">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <div class="progress-time">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </div>

    <div class="links-container">
      
      <!-- Metin2 Discord Projekt -->
      <a href="https://discord.gg/m82ekXdGMs" target="_blank" class="btn metin2">
        <i class="fa-brands fa-discord"></i>
        <span>Metin2 Server</span>
        <span class="badge">Admin</span>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/bafi889" target="_blank" class="btn instagram">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>

      <!-- Spotify -->
      <a href="https://open.spotify.com/search/BafiTV" target="_blank" class="btn spotify">
        <i class="fa-brands fa-spotify"></i>
        <span>Spotify</span>
      </a>

      <!-- Steam -->
      <a href="https://steamcommunity.com/id/Bafi_TV/" target="_blank" class="btn steam">
        <i class="fa-brands fa-steam"></i>
        <span>Steam Profil</span>
      </a>

      <!-- Discord Copy Tag -->
      <div class="btn discord-btn" onclick="copyDiscord()">
        <i class="fa-brands fa-discord"></i>
        <span id="discord-text">Discord: bafi_tv88</span>
      </div>

    </div>

    <footer>© 2026</footer>
  </div>

  <script>
    // --- 1. Animované Pozadí ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 45;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(147, 112, 219, ${this.alpha})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // --- 2. Kopírování Discord Tagu ---
    function copyDiscord() {
      navigator.clipboard.writeText("bafi_tv88");
      const el = document.getElementById("discord-text");
      const originalText = el.innerText;
      el.innerText = "Zkopírováno!";
      setTimeout(() => { el.innerText = originalText; }, 2000);
    }

    // --- 3. Lanyard WebSocket (Real-Time Discord Integration) ---
    const DISCORD_ID = "1032971864269668425";
    let spotifyInterval = null;
    let gameInterval = null;

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function formatGameTime(startMs) {
      const elapsedMs = Date.now() - startMs;
      const totalSec = Math.floor(elapsedMs / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const min = Math.floor((totalSec % 3600) / 60);
      const sec = Math.floor(totalSec % 60);
      
      const pad = (n) => n < 10 ? '0' + n : n;
      return hrs > 0 ? `${pad(hrs)}:${pad(min)}:${pad(sec)}` : `${pad(min)}:${pad(sec)}`;
    }

    function updateLanyardData(lanyardData) {
      if (!lanyardData) return;

      clearInterval(spotifyInterval);
      clearInterval(gameInterval);

      const { discord_status, listening_to_spotify, spotify, activities } = lanyardData;

      // Status tečka
      const statusDot = document.getElementById("status-dot");
      statusDot.className = "status-dot status-" + discord_status;

      // Custom Status z Discordu
      const statusText = document.getElementById("status-text");
      const customStatus = activities ? activities.find(a => a.type === 4) : null;
      
      if (customStatus && customStatus.state) {
        statusText.innerText = customStatus.state;
      } else {
        const fallbackMap = { dnd: "Do Not Disturb", online: "Online", idle: "Idle", offline: "Offline" };
        statusText.innerText = fallbackMap[discord_status] || "Offline";
      }

      // Elementy aktivity
      const actBox = document.getElementById("activity-box");
      const actTitle = document.getElementById("activity-title");
      const actSub = document.getElementById("activity-subtitle");
      const actIcon = document.getElementById("activity-icon");
      const spotifyProg = document.getElementById("spotify-progress");
      const progFill = document.getElementById("progress-fill");
      const timeCur = document.getElementById("time-current");
      const timeTot = document.getElementById("time-total");

      if (listening_to_spotify && spotify) {
        actBox.style.display = "flex";
        spotifyProg.style.display = "block";
        actIcon.className = "fa-brands fa-spotify";
        actIcon.style.color = "#1ed760";
        actTitle.innerText = spotify.song;
        actSub.innerText = "od " + spotify.artist;

        const updateSpotify = () => {
          const now = Date.now();
          const start = spotify.timestamps.start;
          const end = spotify.timestamps.end;
          const total = end - start;
          const current = Math.min(now - start, total);
          const pct = Math.min(Math.max((current / total) * 100, 0), 100);

          progFill.style.width = pct + "%";
          timeCur.innerText = formatTime(current);
          timeTot.innerText = formatTime(total);
        };

        updateSpotify();
        spotifyInterval = setInterval(updateSpotify, 1000);

      } else if (activities && activities.length > 0) {
        const game = activities.find(a => a.type === 0);
        if (game) {
          actBox.style.display = "flex";
          spotifyProg.style.display = "none";
          actIcon.className = "fa-solid fa-gamepad";
          actIcon.style.color = "#7289da";
          actTitle.innerText = "Hraje " + game.name;

          if (game.timestamps && game.timestamps.start) {
            const updateGameTime = () => {
              const durationStr = formatGameTime(game.timestamps.start);
              actSub.innerText = (game.details ? game.details + " • " : "") + durationStr;
            };
            updateGameTime();
            gameInterval = setInterval(updateGameTime, 1000);
          } else {
            actSub.innerText = game.details || game.state || "Právě ve hře";
          }
        } else {
          actBox.style.display = "none";
          spotifyProg.style.display = "none";
        }
      } else {
        actBox.style.display = "none";
        spotifyProg.style.display = "none";
      }
    }

    function connectLanyardWS() {
      const ws = new WebSocket("wss://api.lanyard.rest/socket");

      ws.onopen = () => {
        ws.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: DISCORD_ID }
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.t === "INIT_STATE" || data.t === "PRESENCE_UPDATE") {
          updateLanyardData(data.d);
        }
      };

      ws.onclose = () => {
        setTimeout(connectLanyardWS, 5000);
      };
    }

    connectLanyardWS();
  </script>
</body>
</html>
