<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bafi | Linky</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #000000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 420px;
      padding: 40px 24px;
      background: rgba(12, 12, 12, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.02);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #ffffff, #a1a1a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Mřížka pro dvě tlačítka vedle sebe */
    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-split {
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 14px 10px;
      gap: 6px;
    }

    .btn i {
      font-size: 1.5rem;
      width: 32px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .btn:not(.btn-split) i {
      margin-right: 12px;
    }

    .btn-split i {
      margin-right: 0;
    }

    .btn-split span.title {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-split span.sub {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      color: #d1d1d1;
      padding: 4px 10px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Styl pro Discord */
    .discord:hover {
      border-color: rgba(88, 101, 242, 0.8);
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.15), rgba(88, 101, 242, 0.05));
    }
    .discord:hover i {
      color: #5865F2;
      transform: scale(1.2);
    }

    /* Styk pro Instagram */
    .instagram:hover {
      border-color: rgba(225, 48, 108, 0.8);
      box-shadow: 0 0 20px rgba(225, 48, 108, 0.4);
      transform: translateY(-4px) scale(1.02);
      background: linear-gradient(135deg, rgba(225, 48, 108, 0.15), rgba(253, 29, 29, 0.1));
    }
    .instagram:hover i {
      color: #e1306c;
      transform: scale(1.2) rotate(-5deg);
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <h1>Bafi</h1>

    <div class="links-container">
      <!-- Admin Discord (celá dlaždice) -->
      <a href="https://discord.gg/" target="_blank" class="btn discord">
        <i class="fa-brands fa-discord"></i>
        <span>Admin Discord</span>
        <span class="badge">Server</span>
      </a>

      <!-- 2 dlaždice vedle sebe pod Admin Discordem -->
      <div class="split-row">
        <a href="https://www.instagram.com/n1ggram/" target="_blank" class="btn btn-split instagram">
          <i class="fa-brands fa-instagram"></i>
          <span class="title">Můj Secret</span>
          <span class="sub">@n1ggram</span>
        </a>

        <a href="https://www.instagram.com/bafi_a_dave_irl/" target="_blank" class="btn btn-split instagram">
          <i class="fa-brands fa-instagram"></i>
          <span class="title">Účet Dua</span>
          <span class="sub">@bafi_a_dave_irl</span>
        </a>
      </div>
    </div>

    <footer>
      <span>© 2026 • Bafi</span>
    </footer>
  </div>

  <script>
    // Animace pozadí
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 70;
    const maxDistance = 110;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let a = 0; a < particles.length; a++) {
        particles[a].update();
        particles[a].draw();
        for (let b = a + 1; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDistance) {
            let opacity = 1 - (dist / maxDistance);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.15})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
